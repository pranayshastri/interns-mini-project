syntax = "proto3";
package shop.order.v1;
option go_package = "github.com/platform/gen/orderv1";

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (OrderResponse);
  rpc GetOrder (GetOrderRequest) returns (OrderResponse);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetInvoice (GetInvoiceRequest) returns (InvoiceResponse);
  rpc ListInvoices (ListInvoicesRequest) returns (ListInvoicesResponse);
}

message OrderItem {
  string product_id = 1;
  string shop_id = 2;
  int32 quantity = 3;
  int64 unit_price_cents = 4;
}

message CreateOrderRequest {
  string customer_id = 1;
  repeated OrderItem items = 2;
  string shipping_address = 3;
}

message OrderResponse {
  string order_id = 1;
  string customer_id = 2;
  string status = 3; // PENDING, CONFIRMED, CANCELLED
  int64 total_amount_cents = 4;
  int64 created_at = 5;
  repeated OrderItem items = 6;
  string shipping_address = 7;
}

message GetOrderRequest {
  string order_id = 1;
}

message ListOrdersRequest {
  string customer_id = 1;
  string shop_id = 2;
}

message ListOrdersResponse {
  repeated OrderResponse orders = 1;
}

message GetInvoiceRequest {
  string invoice_id = 1;
}

message ListInvoicesRequest {
  string buyer_id = 1;
}

message InvoiceResponse {
  string invoice_id = 1;
  string order_id = 2;
  string status = 3;
  int64 total_cents = 4;
  string buyer_id = 5;
  string seller_id = 6;
  int64 created_at = 7;
  int64 paid_at = 8;
  string pdf_url = 9;
  repeated OrderItem items = 10;
  string shipping_address = 11;
}

message ListInvoicesResponse {
  repeated InvoiceResponse invoices = 1;
}
